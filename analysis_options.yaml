include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # النسخة المحلية من حزمة pdf (third_party/pdf): شيفرة خارجية منسوخة كما هي
    # مع تعديل موثّق واحد (انظر docs/arabic_word_spacing_fix.md و
    # README-VENDORED.md)، ولا نُخضعها لقواعد تحليل التطبيق.
    - third_party/**
    # كان `test/**` مستثنى مؤقتاً أثناء ترحيل P1، فأخفت الاستثناءة أخطاء
    # ترجمة في الاختبارات الجديدة (مثال موثّق: debugPrint بلا import).
    # أُزيل الاستثناء ليشمل التحليل الاختبارات كما يشمل lib.

linter:
  rules:
    unawaited_futures: true
    use_super_parameters: true
