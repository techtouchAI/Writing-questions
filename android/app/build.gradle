plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // The Flutter Gradle plugin must be applied after the Android and Kotlin plugins.
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Mirror Flutter 3.24's -Ptarget-platform selection for native compilation.
// CMake otherwise builds x86 too, creating a native-only APK ABI with no Flutter
// engine. Filter the CMake build, not APK packaging or Flutter's ABI splits.
// Retain x86 when explicitly requested for a Flutter debug/emulator target.
def writingPlatformAbis = [
    'android-arm': 'armeabi-v7a',
    'android-arm64': 'arm64-v8a',
    'android-x86': 'x86',
    'android-x64': 'x86_64',
]
def writingNativeAbis = (project.findProperty('target-platform') ?:
        'android-arm,android-arm64,android-x64').split(',').collect { platform ->
    def abi = writingPlatformAbis[platform]
    if (abi == null) {
        throw new GradleException("Unsupported native Flutter target: ${platform}")
    }
    abi
}

android {
    namespace 'com.techtouch.writing_questions_app'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.techtouch.writing_questions_app'
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                abiFilters.addAll(writingNativeAbis)
            }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // A production keystore is loaded from the untracked key.properties file.
            // Falling back to the debug key keeps CI builds installable without
            // committing credentials; do not distribute a debug-signed APK.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
