pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file('local.properties')

        if (!localPropertiesFile.exists()) {
            throw new GradleException('local.properties was not found. Run Flutter tooling (for example, flutter pub get) before invoking Gradle directly.')
        }

        localPropertiesFile.withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty('flutter.sdk')
        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
            throw new GradleException('flutter.sdk is not set in local.properties.')
        }
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    id 'com.android.application' version '8.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
}

include ':app'
