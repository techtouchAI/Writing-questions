name: writing_questions_app
description: تطبيق Flutter لإنشاء بنك أسئلة وبناء الاختبارات وتصديرها كملفات PDF وExcel.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^3.6.1
  excel: ^4.0.6
  path_provider: ^2.1.4
  # محرك رسم الـ PDF: الإصداران مثبّتان بدقة لضمان توافق CI مع Flutter 3.22.3.
  pdf: 3.11.3
  printing: 5.13.4
  # عرض صيغ LaTeX (جذور/كسور/تكاملات) داخل لوحة الورقة التفاعلية.
  # 0.7.4 (وليس 0.3.x): إصدار 0.3.x يتطلب provider ^5.0.0 وflutter_svg ^0.22.0
  # وهو منفصل تماماً عن provider ^6.1.2 مما كسر flutter pub get في CI.
  # واجهة Math.tex(text, mathStyle:, textStyle:) ثابتة بين 0.3 و0.7.
  flutter_math_fork: 0.7.4
  # اختيار الصور من بلاطة الوسائط للعناصر الحرة فوق الورقة.
  image_picker: 1.1.2
  provider: ^6.1.2
  share_plus: ^10.0.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
