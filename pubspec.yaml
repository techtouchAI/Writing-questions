name: writing_questions_app
description: تطبيق Flutter لإنشاء بنك أسئلة وبناء الاختبارات وتصديرها كملفات PDF وExcel.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^3.6.1
  excel: ^4.0.6
  path_provider: ^2.1.4
  # محرك رسم الـ PDF: الإصداران مثبّتان بدقة لضمان توافق CI مع Flutter 3.22.3.
  pdf: 3.11.3
  printing: 5.13.4
  # عرض صيغ LaTeX (جذور/كسور/تكاملات) داخل لوحة الورقة التفاعلية.
  # 0.7.2 (وليس 0.3.x ولا 0.7.4): 0.3.x يتطلب provider ^5.0.0 (تعارض مع ^6.1.2)،
  # و0.7.4 يستخدم RenderObjectWithLayoutCallbackMixin من Flutter 3.32 فقط.
  # واجهة Math.tex(text, mathStyle:, textStyle:) ثابتة في كل سلسلة 0.7.x.
  flutter_math_fork: 0.7.2
  # اختيار الصور من بلاطة الوسائط للعناصر الحرة فوق الورقة.
  image_picker: 1.1.2
  provider: ^6.1.2
  share_plus: ^10.0.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.0

# نستخدم نسخة معدّلة محلياً من حزمة pdf 3.11.3 لإصلاح واحد فقط:
# مسافات الكلمات العربية في النص من اليمين إلى اليسار (تدورالأرض ← تدور الأرض).
# التفاصيل الكاملة والقياسات في docs/arabic_word_spacing_fix.md، والمصدر في
# third_party/pdf (نفس إصدار الحزمة 3.11.3 حرفياً + التعديل الموثّق).
dependency_overrides:
  pdf:
    path: third_party/pdf

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  # نفس خط الـ PDF على لوحة المعاينة A4 حتى يتطابق التفاف الأسطر وارتفاع
  # الكتل (ومن ثمّ التقسيم الورقي) بين الشاشة والطباعة.
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    # الخط القرآني (Amiri، رخصة OFL) لآيات القرآن في قالب التربية الإسلامية؛
    # يُستعمل «إن توفّر» وإلا رُسمت الآية بخط الورقة الأساسي بلا فقدان نص.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    # خط عصري نظيف مناسب للمدارس (Tajawal، رخصة OFL).
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    # خط عرض بأسلوب الرقعة للعناوين والترويسة (Rakkas، رخصة OFL).
    - family: Rakkas
      fonts:
        - asset: assets/fonts/Rakkas-Regular.ttf
