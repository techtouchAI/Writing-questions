name: writing_questions_app
description: تطبيق Flutter لإنشاء بنك أسئلة وبناء الاختبارات وتصديرها كملفات PDF وExcel.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^3.6.1
  excel: ^4.0.6
  path_provider: ^2.1.4
  # محرك رسم الـ PDF: الإصداران مثبّتان بدقة لضمان توافق CI مع Flutter 3.22.3.
  pdf: 3.11.3
  printing: 5.13.4
  provider: ^6.1.2
  share_plus: ^10.0.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.0

# نستخدم نسخة معدّلة محلياً من حزمة pdf 3.11.3 لإصلاح واحد فقط:
# مسافات الكلمات العربية في النص من اليمين إلى اليسار (تدورالأرض ← تدور الأرض).
# التفاصيل الكاملة والقياسات في docs/arabic_word_spacing_fix.md، والمصدر في
# third_party/pdf (نفس إصدار الحزمة 3.11.3 حرفياً + التعديل الموثّق).
dependency_overrides:
  pdf:
    path: third_party/pdf

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
