name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Optional: run only this test path (skips APK build + visual job)'
        required: false
        default: ''
        type: string
      test_name:
        description: 'Optional: with test_path, run only tests matching this name (--plain-name)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build APK
    # Pin the runner image to avoid unreviewed toolchain changes from ubuntu-latest.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # Immutable action references avoid surprise changes to the CI toolchain.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # حزمة pdf في هذا المستودع نسخة معدّلة محلياً (third_party/pdf عبر
      # dependency_overrides) تحمل إصلاحاً واحداً: مسافات الكلمات العربية في
      # النص من اليمين إلى اليسار (_Line.realign كان يعكس بعرض الحبر بدل عرض
      # التقدّم). هذا الفحص يفشل بوضوح إذا استُبدلت النسخة بأصل غير مُصلح.
      - name: Verify vendored pdf patch (Arabic RTL word spacing)
        run: dart run tool/verify_vendored_pdf_patch.dart

      - name: Reproduce production R1 and R4 before the full suite
        id: production_first
        shell: bash
        run: |
          set -o pipefail
          status=0
          flutter test --reporter json --timeout 120s \
            test/layout/canonical/production_fragment_regression_test.dart \
            --name '^R[14] ' 2>&1 | tee "$RUNNER_TEMP/production-first.log" || status=$?
          python3 tool/flutter_test_digest.py --log "$RUNNER_TEMP/production-first.log" \
            --out "$RUNNER_TEMP/production-first-digest"
          counts="$(cat "$RUNNER_TEMP/production-first-digest/counts.txt")"
          echo "::notice title=Production R1 R4 first::$counts"
          python3 - <<'PYTARGET'
          import glob, json, os, re
          root = os.path.join(os.environ['RUNNER_TEMP'], 'production-first-digest')
          for path in glob.glob(os.path.join(root, 'excerpt_*.txt')):
              message = open(path).read().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Targeted production failure::{message}')
          matched = set()
          for line in open(os.path.join(os.environ['RUNNER_TEMP'], 'production-first.log')):
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              if event.get('type') == 'testStart':
                  name = event.get('test', {}).get('name', '')
                  if re.match(r'^R[14] ', name):
                      matched.add(name)
          if len(matched) < 5:
              raise SystemExit(f'Targeted gate matched {len(matched)} real R1/R4 cases, expected at least 5; load/setup pseudo-tests do not count.')
          PYTARGET
          exit "$status"

      - name: Run required tests
        id: test
        shell: bash
        run: |
          set -o pipefail
          # json: stable machine protocol for the digest (expanded greps rot
          # with format drift, and emoji markers silently miss failures).
          # --timeout 120s: the framework default is 10 min per widget test,
          # so one hang costs a full CI cycle; nothing green needs even 60 s.
          #
          # REQUIRED GATE (ci_gate_review): every suite except the extended
          # set — iso_*/hang_repro/comprehensive scenario (extended
          # workflow), the canonical hang subset below, and the visual
          # fixture (the visual-parity job runs it once; see W2).
          mapfile -t gate_files < <(find test -name '*_test.dart' \
            ! -path 'test/visual/*' \
            ! -name 'canonical_iso_*' \
            ! -name 'canonical_hang_repro_test.dart' \
            ! -name 'exam_builder_comprehensive_scenario_test.dart' \
            ! -name 'canonical_preview_screen_test.dart' | sort)
          if [ "${#gate_files[@]}" -eq 0 ]; then
            echo 'gate file list is empty; refusing to run the full suite' >&2
            exit 1
          fi
          args=(--reporter json --timeout 120s)
          if [ -n "${{ inputs.test_path }}" ]; then
            args+=("${{ inputs.test_path }}")
          else
            args+=("${gate_files[@]}")
          fi
          if [ -n "${{ inputs.test_name }}" ]; then
            args+=(--plain-name "${{ inputs.test_name }}")
          fi
          # Both invocations always run: a red suite must not starve the
          # gate subset (pipefail alone would abort the step early).
          gate_status=0
          flutter test "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/flutter-test.log" || gate_status=$?
          # Canonical gate subset (W3): test-1 (tap to source offsets) and
          # E7 (paper default) stay Required; tests 2-6 run in Extended
          # until proven hang-free, fast, and stable across runs
          # (re-promotion rule). Single --name regex: repeated
          # --plain-name flags intersect (match nothing), --name alternates.
          if [ -z "${{ inputs.test_path }}" ]; then
            flutter test --reporter json --timeout 120s \
              test/wizard/canonical_preview_screen_test.dart \
              --name 'screen tap follows|seam-free screen shows' \
              2>&1 | tee "$RUNNER_TEMP/flutter-test-canonical-gate.log" || gate_status=$?
          fi
          exit $gate_status

      - name: Analyze source
        id: analyze
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"

      # Structured diagnostics from the JSON reporter (see the digest step):
      # GitHub truncates every annotation at 4 KiB, so the digest pre-chunks
      # failure names/excerpts/timelines annotation-safe. Always exits 0 —
      # diagnostics must never fail the build they diagnose.
      - name: Build test digest
        if: always()
        shell: bash
        run: |
          python3 tool/flutter_test_digest.py \
            --log "$RUNNER_TEMP/flutter-test.log" \
            --out "$RUNNER_TEMP/test-digest"
          cat "$RUNNER_TEMP/test-digest/counts.txt" || true
          if [ -f "$RUNNER_TEMP/flutter-test-canonical-gate.log" ]; then
            python3 tool/flutter_test_digest.py \
              --log "$RUNNER_TEMP/flutter-test-canonical-gate.log" \
              --out "$RUNNER_TEMP/test-digest-gate"
            cat "$RUNNER_TEMP/test-digest-gate/counts.txt" || true
          fi
          main_counts="$(cat "$RUNNER_TEMP/test-digest/counts.txt" 2>/dev/null || true)"
          gate_counts="$(cat "$RUNNER_TEMP/test-digest-gate/counts.txt" 2>/dev/null || true)"
          echo "::notice title=Gate Test Counts::main=[$main_counts] canonical_gate=[$gate_counts]"

      # Vacuous-run guards: a drifted --name (or an emptied file list)
      # must fail loudly, never pass silent. Main suite: ~634 tests (72
      # files incl. suite-load pseudo-tests; static 547 + 15 loop-generated
      # + 72 pseudo — recalibrated in C5b after the editable-DOCX suite
      # deletion; floor 600 keeps a 30+ margin); canonical subset: exactly
      # test-1 + E7 + its load pseudo-test.
      - name: Guard against vacuous gate runs
        if: ${{ always() && inputs.test_path == '' }}
        shell: bash
        run: |
          total_of() {
            awk -F'[= ]' '{s=0; for (i=1; i<=NF; i++) { if ($i=="passed" || $i=="failed" || $i=="skipped") s+=$(i+1) }; print s+0}' "$1"
          }
          main_total=$(total_of "$RUNNER_TEMP/test-digest/counts.txt")
          if [ "$main_total" -lt 600 ]; then
            echo "main gate ran $main_total tests (< 600); failing loudly" >&2
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/test-digest-gate/counts.txt" ]; then
            gate_total=$(total_of "$RUNNER_TEMP/test-digest-gate/counts.txt")
            if [ "$gate_total" -ne 3 ]; then
              echo "canonical gate ran $gate_total tests (!= 3); failing loudly" >&2
              exit 1
            fi
          fi

      # عينات التصدير التي تكتبها الاختبارات إلى build/math_samples — docx من
      # مُصدِّر Word وpdf من مُصدِّر PDF — تُرفع مرفقاً عندما يحمل آخر رسائل
      # الالتزام وسم [math-samples] فقط: يفتحها إنسان في Word/Acrobat ليراجع
      # المعادلات، ومن بلا Flutter في بيئته يحصل على الملفات من هنا. لا وسم ←
      # لا مرفق، فلا ثقل على البناء المعتاد.
      - name: Upload math samples (Word + PDF)
        if: >-
          !cancelled() &&
          contains(github.event.head_commit.message, '[math-samples]')
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: math-samples
          path: build/math_samples/*
          if-no-files-found: error
          retention-days: 30

      # بوابة P0 (test/export_gate) تكتب القطع الثلاثة + المصفوفة إلى
      # build/export_gate؛ تُرفع دائماً لأن الدليل هو غرض البوابة لا رقم
      # الخروج: من راجع الانحدار يريد vector.pdf وexact وخريطة
      # 15×3، لا رسالة «1 test failed». (حُذف editable.docx في C5.)
      - name: Publish production fragment measurements
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Production paper regression measurements\n')
              for path in sorted(glob.glob('build/production_fragment_repro/*.json')):
                  name = os.path.basename(path)
                  data = json.load(open(path))
                  text = json.dumps(data, ensure_ascii=False, indent=2)
                  summary.write(f'### {name}\n```json\n{text}\n```\n')
                  message = json.dumps(data, ensure_ascii=False)
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=Production repro {name}::{message}')
          PY

      - name: Upload production fragment reproductions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-fragment-repro
          path: build/production_fragment_repro
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload P0 export-gate artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: p0-export-gate
          path: build/export_gate/*
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish P0 export-gate matrix
        if: always()
        shell: bash
        run: |
          [ -f build/export_gate/matrix.txt ] || exit 0
          {
            echo '### بوابة P0 — مصفوفة الانحدار (15 ميزة × 4 ممرّات)'
            echo ''
            echo '```'
            cat build/export_gate/matrix.txt
            echo '```'
            echo ''
            if [ -f build/export_gate/summary.txt ]; then
              echo '```'
              tail -n 12 build/export_gate/summary.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # نجاحٌ بلا رقم ليس دليلاً: التعليقات هي القناة الوحيدة التي يقرأها
          # من لا يملك سجلّات التشغيل، فتنشر الحصيلة في الجولة الخضراء كما في
          # الحمراء (لا يُستنتج «نُجحت» من حالة الفحص وحدها).
          if [ -f "$RUNNER_TEMP/test-digest/counts.txt" ]; then
            counts="$(cat "$RUNNER_TEMP/test-digest/counts.txt")"
            counts="${counts//%/%25}"; counts="${counts//:/%3A}"
            counts="${counts//$'\r'/%0D}"; counts="${counts//$'\n'/%0A}"
            echo "::notice title=P0 gate — flutter test::$counts"
          elif [ -f "$RUNNER_TEMP/flutter-test.log" ]; then
            # `|| true` لازم: الخطوة تشتغل بـ `-e -o pipefail`، وgrep بلا مطابقة
            # يخرج 1 — أي أن «صفر أخطاء» كان يُفشل نفس الخطوة التي تنشر النجاح.
            counts="$({ grep -oE '[0-9]+ tests? passed|[0-9]+ tests? failed|All tests passed!|[0-9]+:[0-9]+ \+[0-9]+ ~?[0-9]* ?-?[0-9]*' "$RUNNER_TEMP/flutter-test.log" || true; } | tail -n 4 | tr '\n' ' ')"
            counts="${counts//%/%25}"; counts="${counts//:/%3A}"
            counts="${counts//$'\r'/%0D}"; counts="${counts//$'\n'/%0A}"
            echo "::notice title=P0 gate — flutter test::$counts"
          fi
          if [ -f "$RUNNER_TEMP/test-digest-gate/counts.txt" ]; then
            gate_counts="$(cat "$RUNNER_TEMP/test-digest-gate/counts.txt")"
            gate_counts="${gate_counts//%/%25}"; gate_counts="${gate_counts//:/%3A}"
            gate_counts="${gate_counts//$'\r'/%0D}"; gate_counts="${gate_counts//$'\n'/%0A}"
            echo "::notice title=Canonical gate — flutter test::$gate_counts"
          fi
          if [ -f build/export_gate/matrix.txt ]; then
            tally=""
            for st in PASS FAIL DEFERRED_TO_P1 NOT_APPLICABLE UNMEASURED; do
              n="$({ grep -o "\b$st\b" build/export_gate/matrix.txt || true; } | wc -l | tr -d ' ')"
              tally="$tally$st=$n "
            done
            tally="${tally//%/%25}"; tally="${tally//:/%3A}"
            echo "::notice title=P0 gate — matrix tally::$tally"
            # الحصيلة الرقمية وحدها لا تُرين أي خلية مُؤجَّلة: الجدول كاملاً
            # في تعليق ليُقرأ من الـ API كما من صفحة التشغيل. وترتيب الترميز
            # مهم: `%` أولاً ثم `:` وإلا صار `%3A` نفسه مُرمَّزاً مرتين.
            table="$(cat build/export_gate/matrix.txt)"
            table="${table//%/%25}"; table="${table//:/%3A}"
            table="${table//$'\n'/%0A}"
            echo "::notice title=P0 gate — matrix (60 cells)::$table"
          fi
          # الأدلة الرقمية لكل خلية (أعداد الصفحات، الأسطر، الأجزاء) كانت
          # محصورة في مرفق لا يُقرأ من كل بيئة — فتُنشر تعليقاً أيضاً،
          # فيبقى الرقم قابلاً للتحقق من الـ API كما من صفحة التشغيل.
          if [ -f build/export_gate/summary.txt ]; then
            evidence="$(cat build/export_gate/summary.txt)"
            evidence="${evidence//%/%25}"; evidence="${evidence//:/%3A}"
            evidence="${evidence//$'\r'/%0D}"; evidence="${evidence//$'\n'/%0A}"
            echo "::notice title=P0 gate — summary::$evidence"
          fi
      # GitHub caps error annotations at ~10 per step: one publisher step per
      # category so a long failure list can never starve the excerpts (or the
      # reverse). The tiny publish helpers repeat per step on purpose — no
      # cross-step coupling.
      - name: Publish analyzer findings
        if: failure() && (steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure')
        shell: bash
        run: |
          publish_tail() {
            local file="$1" label="$2" excerpt
            [ -f "$file" ] || return 0
            excerpt="$(tail -n 30 "$file")"
            [ -n "$excerpt" ] || return 0
            excerpt="${excerpt//%/%25}"
            excerpt="${excerpt//$'\r'/%0D}"
            excerpt="${excerpt//$'\n'/%0A}"
            echo "::error title=$label::$excerpt"
          }
          # المحلل قد يُنتج عشرات الأخطاء فلا يكفي ذيل السجل: ننشر **كل**
          # أخطاء المحلل (منزوعة التكرار) ثم ملخّص التحذيرات/الملاحظات،
          # فيظهر سبب الفشل كاملاً من التشغيل نفسه بلا حاجة لتنزيل السجلات.
          publish_analyzer_findings() {
            local file="$1" level="$2" label="$3" limit="$4" lines count
            [ -f "$file" ] || return 0
            lines="$(grep -E "(^|[[:space:]])$level • " "$file" | sort -u | head -n "$limit" || true)"
            [ -n "$lines" ] || return 0
            count="$(printf '%s\n' "$lines" | wc -l | tr -d ' ')"
            lines="${lines//%/%25}"
            lines="${lines//$'\r'/%0D}"
            lines="${lines//$'\n'/%0A}"
            echo "::error title=$label ($count)::$lines"
          }
          # ملاحظات `warning`/`info` تُفشل الخطوة بـ`--fatal-infos` أيضاً، لكن
          # النشر كان يقتصر على `error` فيصل الفشل بلا رقم ولا قاعدة. هنا
          # تُنشر القاعدتان (كل واحدة بحد 60 سطراً) مع حصيلة لكل قاعدة.
          publish_analyzer_tally() {
            local file="$1" tally total
            [ -f "$file" ] || return 0
            total="$(grep -cE '^[[:space:]]+(error|warning|info) • ' "$file" || true)"
            [ -n "$total" ] && [ "$total" -gt 0 ] || return 0
            tally="$({ grep -oE '• [a-z_]+$' "$file" || true; } \
              | sort | uniq -c | sort -rn | tr -s ' ' | tr '\n' ';' || true)"
            tally="${tally//%/%25}"
            echo "::notice title=Analyzer findings tally (total=$total)::$tally"
          }
          publish_analyzer_findings "$RUNNER_TEMP/flutter-analyze.log" 'error' 'Analyzer errors' 80
          publish_analyzer_findings "$RUNNER_TEMP/flutter-analyze.log" 'warning' 'Analyzer warnings' 60
          publish_analyzer_findings "$RUNNER_TEMP/flutter-analyze.log" 'info' 'Analyzer infos' 60
          publish_analyzer_tally "$RUNNER_TEMP/flutter-analyze.log"
          publish_tail "$RUNNER_TEMP/flutter-analyze.log" 'Flutter analyzer log excerpt'

      - name: Publish failing test names
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          # تعليق واحد بمحتوى مُهيَّأ سلفاً (الملخِّص يقطع المقاطع عند ~3KB؛
          # GitHub يبتر الرسائل عند 4KB).
          publish_one() {
            local text="$1"
            [ -n "$text" ] || return 0
            text="${text//%/%25}"
            text="${text//$'\r'/%0D}"
            text="${text//$'\n'/%0A}"
            echo "::error title=$2::$text"
          }
          # القوائم الطويلة (أسماء الفشل، الخطوط الزمنية) تُنشر مجزأة بدقة
          # البايت (~3KB للجزء) فلا يُسقَط أي عنصر عند حد GitHub.
          publish_chunked() {
            local file="$1" title="$2" chunk='' size=0 part=1 lbs line
            [ -f "$file" ] && [ -s "$file" ] || return 0
            while IFS= read -r line || [ -n "$line" ]; do
              lbs="$(printf '%s\n' "$line" | wc -c | tr -d ' ')"
              if [ $((size + lbs)) -gt 3000 ] && [ -n "$chunk" ]; then
                publish_one "$chunk" "$title (part $part)"
                part=$((part + 1)); chunk=''; size=0
              fi
              chunk+="$line"$'\n'; size=$((size + lbs))
            done < "$file"
            if [ "$part" -gt 1 ]; then
              publish_one "$chunk" "$title (part $part)"
            else
              publish_one "$chunk" "$title"
            fi
            return 0
          }
          DIGEST="$RUNNER_TEMP/test-digest"
          if [ -f "$DIGEST/counts.txt" ]; then
            if [ -f "$DIGEST/summary.md" ]; then
              cat "$DIGEST/summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
            # إخفاقات التحميل أولاً: تفسّر غياب ملفات كاملة.
            if [ -s "$DIGEST/compile_errors.txt" ]; then
              publish_one "$(cat "$DIGEST/compile_errors.txt")" 'Dart compiler errors'
            fi
            # كل اسم فاشل، مجزأً — لا يُبتر أبداً.
            if [ -s "$DIGEST/failing.txt" ]; then
              total="$(wc -l < "$DIGEST/failing.txt" | tr -d ' ')"
              publish_chunked "$DIGEST/failing.txt" "Failing tests ($total)"
            fi
          else
            publish_one 'test digest unavailable (log had no JSON events)' 'Test digest missing'
          fi
          # Canonical-gate digest (second flutter run in the gate step).
          GATEDIGEST="$RUNNER_TEMP/test-digest-gate"
          if [ -s "$GATEDIGEST/compile_errors.txt" ]; then
            publish_one "$(cat "$GATEDIGEST/compile_errors.txt")" 'Dart compiler errors (canonical gate)'
          fi
          if [ -s "$GATEDIGEST/failing.txt" ]; then
            gate_total="$(wc -l < "$GATEDIGEST/failing.txt" | tr -d ' ')"
            publish_chunked "$GATEDIGEST/failing.txt" "Failing canonical-gate tests ($gate_total)"
          fi

      - name: Publish test failure excerpts
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          publish_one() {
            local text="$1"
            [ -n "$text" ] || return 0
            text="${text//%/%25}"
            text="${text//$'\r'/%0D}"
            text="${text//$'\n'/%0A}"
            echo "::error title=$2::$text"
          }
          DIGEST="$RUNNER_TEMP/test-digest"
          [ -f "$DIGEST/counts.txt" ] || exit 0
          # مقاطع الأخطاء الأولى، بسقف 10 تعليقات (الأسماء تغطي الكل).
          total="$(ls "$DIGEST"/excerpt_*.txt 2>/dev/null | wc -l | tr -d ' ' || true)"
          i=0
          for f in "$DIGEST"/excerpt_*.txt; do
            [ -f "$f" ] || break
            i=$((i + 1))
            if [ "$i" -gt 10 ]; then break; fi
            name="$(sed -n '2p' "$f" | sed 's/^TEST: //')"
            publish_one "$(cat "$f")" "Test failure ($i/$total): ${name:0:120}"
          done
          GATEDIGEST="$RUNNER_TEMP/test-digest-gate"
          gate_total="$(ls "$GATEDIGEST"/excerpt_*.txt 2>/dev/null | wc -l | tr -d ' ' || true)"
          j=0
          for f in "$GATEDIGEST"/excerpt_*.txt; do
            [ -f "$f" ] || break
            j=$((j + 1))
            if [ "$j" -gt 10 ]; then break; fi
            name="$(sed -n '2p' "$f" | sed 's/^TEST: //')"
            publish_one "$(cat "$f")" "Gate failure ($j/$gate_total): ${name:0:120}"
          done

      - name: Publish P0 gate and debug timelines
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          publish_one() {
            local text="$1"
            [ -n "$text" ] || return 0
            text="${text//%/%25}"
            text="${text//$'\r'/%0D}"
            text="${text//$'\n'/%0A}"
            echo "::error title=$2::$text"
          }
          publish_chunked() {
            local file="$1" title="$2" chunk='' size=0 part=1 lbs line
            [ -f "$file" ] && [ -s "$file" ] || return 0
            while IFS= read -r line || [ -n "$line" ]; do
              lbs="$(printf '%s\n' "$line" | wc -c | tr -d ' ')"
              if [ $((size + lbs)) -gt 3000 ] && [ -n "$chunk" ]; then
                publish_one "$chunk" "$title (part $part)"
                part=$((part + 1)); chunk=''; size=0
              fi
              chunk+="$line"$'\n'; size=$((size + lbs))
            done < "$file"
            if [ "$part" -gt 1 ]; then
              publish_one "$chunk" "$title (part $part)"
            else
              publish_one "$chunk" "$title"
            fi
            return 0
          }
          DIGEST="$RUNNER_TEMP/test-digest"
          [ -f "$DIGEST/counts.txt" ] || exit 0
          # سبب مستقل لكل اختبار بوابة فاشل (المعرّفات ثابتة فالعدد محدود).
          for f in "$DIGEST"/p0_*.txt; do
            [ -f "$f" ] || break
            id="${f##*/p0_}"; id="${id%.txt}"
            publish_one "$(cat "$f")" "P0-GATE-$id reason"
          done
          # تقدّم البوابة: آخر 24 مرحلة (أسطر نظيفة بلا تغليف JSON) بعد
          # إسقاط ثرثرة التشكيل المتكررة التي كانت تطغى على النافذة كلها.
          if [ -s "$DIGEST/p0gate_timeline.txt" ]; then
            stages="$(grep -v 'bidi shaped input' "$DIGEST/p0gate_timeline.txt" | tail -n 24)"
            count="$(printf '%s\n' "$stages" | wc -l | tr -d ' ')"
            publish_one "$stages" "P0 gate stages (last $count)"
          fi
          # قناة printf-debugging: مخرجات [diag] مجزأة ومحدودة كي لا تُجوّع
          # أسباب البوابة أعلاه.
          if [ -s "$DIGEST/diag.txt" ]; then
            head -c 9000 "$DIGEST/diag.txt" > "$RUNNER_TEMP/diag_head.txt"
            publish_chunked "$RUNNER_TEMP/diag_head.txt" 'Test diagnostics ([diag])'
          fi
          if [ -s "$RUNNER_TEMP/test-digest-gate/diag.txt" ]; then
            head -c 9000 "$RUNNER_TEMP/test-digest-gate/diag.txt" > "$RUNNER_TEMP/diag_gate_head.txt"
            publish_chunked "$RUNNER_TEMP/diag_gate_head.txt" 'Gate diagnostics ([diag])'
          fi
          # الركيزة تعمل داخل هذه الحزمة أيضاً؛ ذيلها يوجّه تنقيح التعلّق.
          if [ -s "$DIGEST/fixture_timeline.txt" ]; then
            publish_one "$(tail -n 15 "$DIGEST/fixture_timeline.txt")" 'Fixture progress (build job)'
          fi

      # Slowest-tests timing (T1): informational on green AND red — gate
      # performance is evidence, not just failure forensics.
      - name: Publish slowest tests
        if: always()
        shell: bash
        run: |
          publish_one() {
            local text="$1"
            [ -n "$text" ] || return 0
            text="${text//%/%25}"
            text="${text//$'\r'/%0D}"
            text="${text//$'\n'/%0A}"
            echo "::notice title=$2::$text"
          }
          if [ -s "$RUNNER_TEMP/test-digest/slowest.txt" ]; then
            publish_one "$(cat "$RUNNER_TEMP/test-digest/slowest.txt")" 'Slowest tests (top 15)'
          fi
          if [ -s "$RUNNER_TEMP/test-digest-gate/slowest.txt" ]; then
            publish_one "$(cat "$RUNNER_TEMP/test-digest-gate/slowest.txt")" 'Slowest canonical-gate tests'
          fi

      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-validation-diagnostics
          path: |
            ${{ runner.temp }}/flutter-analyze.log
            ${{ runner.temp }}/flutter-test.log
            ${{ runner.temp }}/flutter-test-canonical-gate.log
            ${{ runner.temp }}/flutter-build.log
            ${{ runner.temp }}/test-digest/*
            ${{ runner.temp }}/test-digest-gate/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release APK
        id: build
        # Targeted runs (dispatch with test_path) iterate on tests only.
        if: ${{ inputs.test_path == '' }}
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"

      # تعذّر فشل بناء APK لا يُظهره محلّل Dart ولا الاختبارات (Kotlin/Gradle)،
      # فننشر أخطاء البناء نفسها كتعليقات على التشغيل.
      - name: Publish build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          publish_excerpt() {
            local label="$1" excerpt="$2"
            [ -n "$excerpt" ] || return 0
            excerpt="${excerpt//%/%25}"
            excerpt="${excerpt//$'\r'/%0D}"
            excerpt="${excerpt//$'\n'/%0A}"
            echo "::error title=$label::$excerpt"
          }
          file="$RUNNER_TEMP/flutter-build.log"
          [ -f "$file" ] || exit 0
          errors="$(grep -E '^e: |^w: |error:|FAILURE: |Execution failed for task|> Task .*FAILED|Caused by: |What went wrong|Could not (resolve|determine)|A problem occurred' "$file" | head -n 60 || true)"
          publish_excerpt 'Flutter/Gradle build errors' "$errors"
          publish_excerpt 'Flutter/Gradle build log tail' "$(tail -n 80 "$file")"

      - name: Upload APK artifact
        if: ${{ inputs.test_path == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: writing-questions-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # التحقق البصري الخارجي: يُصيّر Vector PDF وExact المستقل
  # بمحرّكات أخرى ويقارن كل صفحة بالمعاينة عبر RMSE فعلي (انظر
  # tool/verify_visual_parity.sh). فشل أي مسار هو فشل CI.
  # --------------------------------------------------------------------------
  visual-parity:
    name: Visual regression (Vector/Exact vs preview)
    # Targeted runs skip the visual job unless the target is the fixture.
    if: ${{ inputs.test_path == '' || startsWith(inputs.test_path, 'test/visual') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # poppler لتصيير PDF، ImageMagick للمقارنة، وLibreOffice لتصيير Word
      # (ثم يُحوَّل ناتجه إلى PDF بالـpoppler نفسه).
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils imagemagick libreoffice-writer

      # تنتج الركيزة اللقطات المرجعية وVector PDF وEditable/Exact DOCX/PDF؛
      # وفشلها يجب أن يظهر سببه لا رقم خروجه فقط.
      - name: Produce preview and export comparison artifacts
        shell: bash
        run: |
          mkdir -p build/visual_parity
          set -o pipefail
          flutter test --reporter json test/visual/visual_parity_fixture_test.dart 2>&1 \
            | tee build/visual_parity/fixture_test.log

      # [C6-POS] تشخيص غير ملزم: مواضع النص في المعاينة ثم في vector.pdf الذي
      # كتبه الاختبار أعلاه مباشرة (بلا تنزيل artifact). لا يغيّر البوابة
      # الرسمية أو عتبة RMSE أو نتيجة هذه الوظيفة؛ كل خطوة continue-on-error.
      - name: Record Preview text positions (non-gating)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/visual_parity/c6diag/text_positions
          set -o pipefail
          flutter test test/visual/diag_c6_text_positions_test.dart 2>&1 \
            | tee build/visual_parity/c6diag/text_positions/flutter.log

      - name: Compare PDF and Preview text positions (non-gating)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/c6pos-venv"
          "$RUNNER_TEMP/c6pos-venv/bin/pip" install -q pymupdf numpy
          "$RUNNER_TEMP/c6pos-venv/bin/python" tool/diag_c6_text_positions.py build/visual_parity

      # [C6-GEOMETRY] الطبقة الأولى من العقد ذي الطبقتين. الحكم على فترات
      # الكتابة (layoutWords) وأصل الحرف، لا على مربع الحبر الضيّق. مربعات
      # الحبر تُنشر تشخيصاً مصنَّفاً ولا تُسقط الوظيفة. الأسلوب ما زال report:
      # --mode enforce غير موصول، وسقف RMSE 0.02 والصور المرجعية لم تُمس.
      - name: Verify PDF geometry against the Preview (report, not adopted)
        if: always()
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/c6geom-venv"
          "$RUNNER_TEMP/c6geom-venv/bin/pip" install -q pymupdf
          "$RUNNER_TEMP/c6geom-venv/bin/python" tool/c6_geometry_gate.py \
            build/visual_parity --mode report

      # [C6-RASTER] تشخيص غير ملزم: هل تُقرّب المعاينة (Flutter) وPoppler موضع
      # خط الأساس بقاعدة واحدة عند كسور مختلفة من البكسل؟ لا يغيّر البوابة
      # الرسمية أو عتبة RMSE أو الصور المرجعية أو نتيجة الوظيفة.
      - name: Record baseline sub-pixel probe (non-gating)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/visual_parity/c6diag/baseline_raster
          set -o pipefail
          flutter test test/visual/diag_c6_baseline_raster_test.dart 2>&1 \
            | tee build/visual_parity/c6diag/baseline_raster/flutter.log

      - name: Analyse baseline sub-pixel probe (non-gating)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/c6raster-venv"
          "$RUNNER_TEMP/c6raster-venv/bin/pip" install -q pymupdf numpy
          "$RUNNER_TEMP/c6raster-venv/bin/python" tool/diag_c6_baseline_raster.py build/visual_parity/c6diag/baseline_raster

      - name: Build fixture digest
        if: always()
        shell: bash
        run: |
          python3 tool/flutter_test_digest.py \
            --log build/visual_parity/fixture_test.log \
            --out build/visual_parity/digest
          cat build/visual_parity/digest/counts.txt || true

      # always: a geometry measurement error must not skip the required gate.
      - name: Compare rendered files against the preview (RMSE)
        if: always()
        shell: bash
        run: |
          bash tool/verify_visual_parity.sh build/visual_parity
          if [ -s build/visual_parity/report.txt ]; then
            rep="$(tail -n 18 build/visual_parity/report.txt)"
            rep="${rep//%/%25}"
            rep="${rep//$'\r'/%0D}"
            rep="${rep//$'\n'/%0A}"
            echo "::notice title=Visual Parity Gate Summary::$rep"
          fi

      # [P3-TEXT] دليل النص القابل للاستخراج من ملف PDF الفعلي (لا من الشيفرة).
      # البوابة تقارن الصور، والصورة لا تكشف كلمةً غطّت أخرى أو رقمًا ضاع؛ هذا
      # الاستخراج يكشفه ويُحفظ مرفقًا للمراجعة البشرية. لا يُسقط الوظيفة بنفسه:
      # الحكم على النص في test/pdf_engine/pdf_word_overlap_test.dart (يقرأ
      # Td/TJ من الملف نفسه بلا أدوات خارجية)، وهذا السجل دليل لا بوابة.
      - name: Extract PDF text (searchability evidence)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f build/visual_parity/vector.pdf ]; then
            echo "::notice title=P3 text evidence::vector.pdf missing — skipped"
            exit 0
          fi
          pdftotext -layout -enc UTF-8 build/visual_parity/vector.pdf \
            build/visual_parity/vector.txt
          echo '### P3 — النص المستخرَج من vector.pdf' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -n 40 build/visual_parity/vector.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          text="$(head -n 40 build/visual_parity/vector.txt)"
          text="${text//%/%25}"; text="${text//$'\r'/%0D}"; text="${text//$'\n'/%0A}"
          echo "::notice title=P3 extracted PDF text::$text"

      - name: Upload P3 text-extraction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p3-pdf-text
          path: build/visual_parity/vector.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify Issue 1 & Issue 2 sample exports via Poppler and LibreOffice
        shell: bash
        run: |
          flutter test test/pdf_engine/arabic_parentheses_pipeline_test.dart
          bash tool/verify_visual_parity.sh build/issue1_issue2_samples
          if [ -s build/issue1_issue2_samples/report.txt ]; then
            srep="$(tail -n 18 build/issue1_issue2_samples/report.txt)"
            srep="${srep//%/%25}"
            srep="${srep//$'\r'/%0D}"
            srep="${srep//$'\n'/%0A}"
            echo "::notice title=Issue 1+2 Sample Export Visual Parity::$srep"
          fi

      # سبب الفشل يُنشر كتعليق على التشغيل: سجلات CI قد لا تكون مقروءة من كل
      # بيئة، والملخّص يجب أن يحمل السبب لا رقم الخروج وحده.
      - name: Publish visual parity report
        if: failure()
        shell: bash
        run: |
          annotate() { # <العنوان> <النص>
            local text="$1"
            text="${text//%/%25}"
            text="${text//$'\r'/%0D}"
            text="${text//$'\n'/%0A}"
            echo "::error title=$2::$text"
          }

          report=build/visual_parity/report.txt
          if [ -f "$report" ]; then
            annotate "$(tail -n 25 "$report")" "الطابقة البصرية"
          fi

          log=build/visual_parity/fixture_test.log
          digest=build/visual_parity/digest
          if [ -f "$digest/counts.txt" ]; then
            # (1) كامل الخط الزمني للركيزة مجزأً (~3KB للجزء؛ GitHub يبتر عند
            # 4KB) — نافذة «آخر 8 أسطر» كانت تخفي موقع التعلّق الحقيقي.
            if [ -s "$digest/fixture_timeline.txt" ]; then
              rm -rf "$RUNNER_TEMP/fixture_chunks" && mkdir -p "$RUNNER_TEMP/fixture_chunks"
              split -C 3000 --numeric-suffixes=1 "$digest/fixture_timeline.txt" \
                "$RUNNER_TEMP/fixture_chunks/part_"
              chunks=("$RUNNER_TEMP"/fixture_chunks/part_*)
              if [ "${#chunks[@]}" -eq 1 ]; then
                annotate "$(cat "${chunks[0]}")" "مسار الركيزة"
              else
                k=0
                for c in "${chunks[@]}"; do
                  k=$((k + 1))
                  annotate "$(cat "$c")" "مسار الركيزة (جزء $k من ${#chunks[@]})"
                done
              fi
            fi
            # (2) رسالة الفشل نفسها (توقّع/استثناء) بلا تغليف JSON.
            for f in "$digest"/excerpt_*.txt; do
              [ -f "$f" ] || break
              name="$(sed -n '2p' "$f" | sed 's/^TEST: //')"
              annotate "$(cat "$f")" "سبب فشل الركيزة: ${name:0:100}"
            done
            exit 0
          fi
          # احتياط: الملخّص غائب (فشل التشغيل قبل الاختبارات).
          [ -f "$log" ] || exit 0
          stages="$(grep -F '[fixture]' "$log" | tail -n 8 || true)"
          [ -z "$stages" ] || annotate "$stages" "مسار الركيزة"
          failure="$(grep -m 1 -A 14 -F -e '[E]' -e 'Expected:' -e 'Actual:' -e 'Exception' -e 'assertion' "$log" || true)"
          [ -z "$failure" ] || annotate "$failure" "سبب فشل الركيزة"

      # مقاييس التشغيل تُنشر دائماً (نجاحاً وفشلاً): الرقم هو الدليل، ولا يُترك
      # في مرفق لا يُقرأ — عند النجاح يظهر في تعليقات التشغيل بلا فتح سجلات.
      - name: Summarize visual parity measurements
        if: always()
        shell: bash
        run: |
          file=build/visual_parity/report.txt
          [ -f "$file" ] || exit 0
          summary="$(grep -E 'RMSE|البكسلات المضمّنة|النتيجة' "$file" | tail -n 12 || true)"
          [ -n "$summary" ] || exit 0
          summary="${summary//%/%25}"
          summary="${summary//$'\r'/%0D}"
          summary="${summary//$'\n'/%0A}"
          echo "::notice title=مقاييس التحقق البصري::$summary"

      - name: Upload visual parity artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-parity
          path: build/visual_parity
          if-no-files-found: warn
          retention-days: 14

      # [C6-ITALIC] اختبار انحدار بوابي: يقيس ميلان النص المائل في المعاينة من
      # البكسل نفسه ويقارنه بالعامل الذي يصدّره `CanonicalText`. الثابت وحده لا
      # يُثبت شيئاً؛ القياس هو الدليل. الخطوة أخيراً عمداً: لا تحجب تقرير بوابة
      # RMSE ولا ملخّص المقاييس، وهي لا تمسّ العتبة ولا الصور المرجعية.
      - name: Verify the Preview italic oblique against the emitted shear
        if: always()
        shell: bash
        run: flutter test test/visual/italic_oblique_probe_test.dart

      # [C6-UNDERLINE] يقيس التسطير الذي ترسمه المعاينة (إزاحته تحت خط الأساس
      # وسماكته) وينشره رقماً: خرائط الحبر دلّت على فارق 4px بين السطرين،
      # والرقم الصحيح لا يُخمَّن من خريطة. لا يمسّ العتبة ولا الصور المرجعية.
      - name: Measure the Preview underline geometry (measurement, not a gate)
        if: always()
        continue-on-error: true
        shell: bash
        run: flutter test test/visual/underline_geometry_probe_test.dart

      # يفشل التحويل الناقص أو الملف القديم أو الفارغ. لا يغيّر سقف RMSE،
      # ويُشغَّل بعد المقارنة حتى لا يحجب تقريرها.
      - name: Check visual-parity conversion error handling
        if: always()
        shell: bash
        run: bash tool/test_verify_visual_parity.sh

      # [C6-UNDERLINE] بوابة على خاصية يملكها المشروع: موضع التسطير بالنسبة
      # لنصّه هو نفسه في المعاينة وفي vector.pdf. تُقاس الهندسة من الملف نفسه
      # (لا رَستَرة)، ويُقاس الحبر في اللقطة، فتُقارن إزاحتان بمرجع واحد بدل
      # مقارنة مصيِّرين. مستقلّة عن عتبة RMSE: لا تمسّها ولا تُخفِ فشلها.
      - name: Verify underline placement matches the Preview (gating)
        if: always()
        shell: bash
        run: |
          "$RUNNER_TEMP/c6raster-venv/bin/python" tool/check_underline_parity.py \
            build/visual_parity 2>/dev/null || {
              python3 -m venv "$RUNNER_TEMP/underline-venv"
              "$RUNNER_TEMP/underline-venv/bin/pip" install -q pymupdf
              "$RUNNER_TEMP/underline-venv/bin/python" \
                tool/check_underline_parity.py build/visual_parity
            }

  # تحقيق C6 غير مُلزِم. يقرأ artifact الذي تنتجه وظيفة visual-parity نفسها،
  # ولا يغيّر بوابة RMSE أو عتبتها (0.02) أو الصور المرجعية أو نتيجة الوظيفة.
  # فشله لا يفشل التشغيل (continue-on-error). الأدوات في tool/diag_c6_*.py.
  c6-diagnostics:
    name: C6 diagnostics (non-gating)
    needs: visual-parity
    if: ${{ always() && needs.visual-parity.result != 'skipped' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download visual parity artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: visual-parity
          path: build/visual_parity

      - name: Install rendering and diagnostic tools
        shell: bash
        # ميزانية الخطوة < مهلة الوظيفة (20m): التثبيت البطيء على مرآة apt
        # يتوقف هنا برسالة صريحة قبل أن تُلغى الوظيفة كلها.
        timeout-minutes: 16
        run: |
          # [C6-SETUP] كل خطوة تثبيت محدودة زمنياً: التشخيص على تشغيلين
          # متزامنين (‏13:30 و13:37) استهلك مهلة الوظيفة كلها (20m) بلا سجل
          # مفيد، ثم ظهر `exit code 127` من خطوات تالية لأن
          # `$RUNNER_TEMP/diag-venv/bin/python` لم يكن قد أُنشئ. الوظيفة نفسها
          # على نفس الالتزام استغرقت 2m36s حين لم يتعلّق التثبيت. فالحدّ
          # الزمني يحوّل التعليق إلى فشل صريح سريع بدل استهلاك المهلة، ولا
          # يغيّر أي فحص ولا عتبة ولا يحوّل الوظيفة إلى بوابة.
          fail_setup () {
            echo "::error title=C6 setup::$1"
            exit 1
          }
          # مهلات الشبكة الداخلية تحوّل المرآة المتوقفة إلى فشل سريع بدل تعليق.
          timeout 150 sudo apt-get -o Acquire::http::Timeout=20 \
              -o Acquire::Retries=2 update \
            || fail_setup 'apt-get update تجاوز 150s أو فشل'
          timeout 300 sudo apt-get -o Acquire::http::Timeout=20 \
              -o Acquire::Retries=2 install -y --no-install-recommends \
              poppler-utils imagemagick \
            || fail_setup 'تثبيت poppler/imagemagick تجاوز 300s أو فشل'
          # [C6-ATTR] مصيِّر ثانٍ مستقل لضابط أرضية المصيِّر: يقيس، في كل تشغيل
          # وعلى نفس بايتات vector.pdf، ما لا يستطيع أي تغيير في التخطيط أو
          # التنسيق إزالته (فرق الرَّستَرة نفسه). غير ملزم ولا يمسّ البوابة.
          # فشل التثبيت لا يُسقط الوظيفة؛ الأداة تعلن غياب الضابط صراحةً.
          timeout 180 sudo apt-get -o Acquire::http::Timeout=20 \
              install -y --no-install-recommends mupdf-tools \
            || echo "::warning title=C6 renderer floor::mupdf-tools unavailable"
          timeout 180 sudo apt-get -o Acquire::http::Timeout=20 \
              install -y --no-install-recommends ghostscript \
            || echo "::warning title=C6 renderer floor::ghostscript unavailable"
          timeout 120 python3 -m venv "$RUNNER_TEMP/diag-venv" \
            || fail_setup 'إنشاء venv تجاوز 120s'
          timeout 420 "$RUNNER_TEMP/diag-venv/bin/pip" install -q \
              --timeout 60 --retries 2 pymupdf numpy \
            || fail_setup 'تثبيت pymupdf/numpy تجاوز 420s أو فشل'
          "$RUNNER_TEMP/diag-venv/bin/python" -c 'import fitz, numpy' \
            || fail_setup 'حزم التشخيص غير قابلة للاستيراد بعد التثبيت'

      - name: Unit tests of the C6 diagnostics (synthetic + real-artifact suites)
        shell: bash
        run: |
          # A failing unittest prints to the step log, which the checks API does
          # not expose. Re-emit the tail as an annotation so a failure is
          # actionable from the run's annotations alone.
          run_suite () {
            "$RUNNER_TEMP/diag-venv/bin/python" "$@" 2>&1 | tee /tmp/c6-suite.log || {
              tail -n 12 /tmp/c6-suite.log | while IFS= read -r line; do
                echo "::error title=C6 unit tests::$line"
              done
              return 1
            }
          }
          run_suite -m unittest discover -s tool -p 'test_diag_c6_*.py' -v
          # عائلة التسطير الاصطناعي وحدها هنا؛ عائلتها الحقيقية خطوة مستقلة
          # أدناه حتى يبقى الفصل بين الدليلين ظاهراً في سجلات التشغيل.
          run_suite -m unittest discover -s tool -p 'test_diag_c6_underline_parity.py' -v
          run_suite -m unittest tool/test_c6_geometry_gate.py -v
          run_suite -m unittest tool/test_c6_visual_calibration.py -v

      # [C6-GEOMETRY] الاختبارات السلبية على **المخرجات الحقيقية**: تُحقن
      # إزاحة وحذف وإزالة تسطير في هندسة البوابة نفسها ويجب أن تُرفض. اختبار
      # بوابة لا يُثبت أنها ترفض إلا إذا رفضت على صورتها الحقيقية لا على نموذج.
      - name: Negative tests of the geometry gate on the real artifacts
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          C6_ARTIFACTS=build/visual_parity \
            "$RUNNER_TEMP/diag-venv/bin/python" -m unittest \
            tool.test_c6_geometry_gate.RealArtifacts -v 2>&1 | tee /tmp/c6-real.log \
            || {
              tail -n 12 /tmp/c6-real.log | while IFS= read -r line; do
                echo "::error title=C6 real-artifact tests::$line"
              done
              exit 1
            }

      # [C6-UNDERLINE] عائلة التسطير **الحقيقية**، منفصلة عن الاصطناعية:
      # التسطير الحقيقي في مخرجات التركيبة نفسها يُقاس ويُقارن (والحبر
      # المفقود skip لا اتفاق). الاصطناعية (منطق الكاشف على صفحات مرسومة
      # بإزاحات معروفة) تبقى في خطوتها أعلاه.
      - name: Real-artifact underline tests (separated from the synthetic)
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          run_real () {
            C6_ARTIFACTS=build/visual_parity \
              "$RUNNER_TEMP/diag-venv/bin/python" "$@" 2>&1 | tee /tmp/c6-real.log || {
                tail -n 12 /tmp/c6-real.log | while IFS= read -r line; do
                  echo "::error title=C6 real-underline tests::$line"
                done
                return 1
              }
          }
          run_real -m unittest tool.test_diag_c6_underline_real_artifacts -v

      # [C6-CONTENT] حذف النصوص والمعادلات الصغيرة ذات الدلالة على **المخرجات
      # الحقيقية**: يُمسح سطر نص حقيقي ومعادلة صغيرة حقيقية من صفحة التركيبة
      # فيجب أن ترفض بوابة المحتوى كليهما — حساسية مثبتة على الصورة الحقيقية.
      - name: Content-gate deletion tests on the real artifacts
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          C6_ARTIFACTS=build/visual_parity \
            "$RUNNER_TEMP/diag-venv/bin/python" -m unittest \
            tool.test_diag_c6_visual_content_gate.RealArtifacts -v 2>&1 \
            | tee /tmp/c6-content.log || {
              tail -n 12 /tmp/c6-content.log | while IFS= read -r line; do
                echo "::error title=C6 real-content tests::$line"
              done
              exit 1
            }

      # [C6-CALIBRATION] الطبقة الثانية: تقيس أرضية المصيّرين على نفس PDF
      # بإعدادات موثّقة، وتقيس انحدارات متعمدة (إزاحة 1/2/4 بكسل، تكبير 2%،
      # حذف شريط نص، تحريك قاعدة التسطير 4 بكسل) بالمقياس نفسه الذي تقيس به
      # البوابة. تقترح عتبة فقط إن وُجد فصل حقيقي، وتعلنها PROPOSED غير
      # معتمدة. لا تغيّر أي عتبة ولا صورة. هنا لأن هذه الوظيفة تملك المصيِّرين
      # (poppler + mupdf) والأدوات، بخلاف وظيفة البوابة.
      - name: Calibrate the pixel tier against the renderer floor (proposal only)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/diag-venv/bin/python" tool/c6_visual_calibration.py \
            build/visual_parity 2>&1 | tail -60 || true

      # [C6-FAIR] يبحث على بايتات vector.pdf نفسها عن تطبيع يبقى تحت 0.02
      # للمحتوى المتطابق بين مصيّرين، ويرفض الإزاحة والحذف وتحريك التسطير.
      # لا يغيّر البوابة ولا العتبة ولا الصور. الناتج اقتراح أو رفض صريح.
      - name: Search a fair comparison on the actual files (non-gating)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/diag-venv/bin/python" tool/diag_c6_fair_compare.py \
            build/visual_parity

      - name: C6 geometry gate on the real artifacts (report)
        if: always()
        shell: bash
        run: |
          "$RUNNER_TEMP/diag-venv/bin/python" tool/c6_geometry_gate.py \
            build/visual_parity --mode report

      - name: C6 diagnostics on the rendered artifacts
        shell: bash
        run: |
          mkdir -p build/visual_parity/c6diag
          for tool in diag_c6_pdf_frame diag_c6_variants diag_c6_text_residual \
                      diag_c6_text_geometry diag_c6_nontext_excess \
                      diag_c6_coverage_profile diag_c6_rule_geometry; do
            echo "::group::$tool"
            "$RUNNER_TEMP/diag-venv/bin/python" "tool/$tool.py" build/visual_parity \
              || echo "::warning title=$tool::diagnostic exited non-zero (non-gating)"
            echo "::endgroup::"
          done

      # [C6-INK] تشخيص غير ملزم: كثافة الحبر داخل نوافذ الكلمات المتحقَّق منها
      # فقط، مع ضابط PDF مقابل PDF. لا يغيّر البوابة أو العتبة أو الصور.
      - name: C6 ink density inside verified word windows (non-gating)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/diag-venv/bin/python" tool/diag_c6_ink_windows.py build/visual_parity

      # [C6-ATTR] إسناد RMSE إلى العناصر (non-gating). خطوة مستقلة عمداً:
      # GitHub يحتفظ بنحو 10 تعليقات لكل خطوة، فلو شارك هذه الأداة الخطوة
      # المجمّعة أعلاه لابتلع رصيدها أدواتٌ تعمل قبله ولما قُرئ ناتجها أصلاً.
      - name: C6 element attribution of the Vector RMSE (non-gating)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/visual_parity/c6diag
          "$RUNNER_TEMP/diag-venv/bin/python" tool/diag_c6_element_attribution.py \
            build/visual_parity

      # [C6-ATTR] مخرجات الإسناد العنصري (non-gating): تُرفع مع بقية تشخيص C6.
      - name: Upload C6 element-attribution diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c6-element-attribution
          path: build/visual_parity/c6diag/element_attribution/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload C6 ink-window diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c6-ink-windows
          path: build/visual_parity/c6diag/ink_windows/*
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Attach APK to GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Pin the runner image to avoid unreviewed toolchain changes from ubuntu-latest.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: writing-questions-release-apk
          path: release-artifact

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-artifact/app-release.apk
