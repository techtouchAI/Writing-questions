name: Build & Release Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      # Third-party actions are SHA-pinned (supply-chain hygiene).
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: 3.22.3
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        id: analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee /tmp/analyze.log

      - name: Run tests
        id: test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/test.log

      # Keeps static-analysis/test failures visible even when the log
      # download endpoint is unavailable.
      - name: Report toolchain failures on the PR
        if: failure() && (steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "🔧 Toolchain failure report for run ${GITHUB_RUN_ID}:"
            if [ -f /tmp/analyze.log ]; then
              echo
              echo '**flutter analyze:**'
              echo '```text'
              tail -c 4000 /tmp/analyze.log
              echo '```'
            fi
            if [ -f /tmp/test.log ]; then
              echo
              echo '**flutter test:**'
              echo '```text'
              tail -c 4000 /tmp/test.log
              echo '```'
            fi
          } > failure-report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file failure-report.md

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
