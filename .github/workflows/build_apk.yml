name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build APK
    # Pin the runner image to avoid unreviewed toolchain changes from ubuntu-latest.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # Immutable action references avoid surprise changes to the CI toolchain.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze source
        id: analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"

      - name: Run tests
        id: test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"

      - name: Publish analyzer and test diagnostics
        if: failure() && (steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure')
        shell: bash
        run: |
          publish_tail() {
            local file="$1" label="$2" excerpt
            [ -f "$file" ] || return 0
            excerpt="$(tail -n 30 "$file")"
            [ -n "$excerpt" ] || return 0
            excerpt="${excerpt//%/%25}"
            excerpt="${excerpt//$'\r'/%0D}"
            excerpt="${excerpt//$'\n'/%0A}"
            echo "::error title=$label::$excerpt"
          }
          publish_tail "$RUNNER_TEMP/flutter-analyze.log" 'Flutter analyzer log excerpt'
          publish_tail "$RUNNER_TEMP/flutter-test.log" 'Flutter test log excerpt'

      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-validation-diagnostics
          path: |
            ${{ runner.temp }}/flutter-analyze.log
            ${{ runner.temp }}/flutter-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: writing-questions-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach APK to GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Pin the runner image to avoid unreviewed toolchain changes from ubuntu-latest.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: writing-questions-release-apk
          path: release-artifact

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-artifact/app-release.apk
