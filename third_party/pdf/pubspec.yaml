name: pdf
description: >-
  نسخة محلية من الحزمة pdf 3.11.3 (A pdf producer for Dart) تحمل تعديلاً واحداً
  موثّقاً: إصلاح مسافات الكلمات العربية في النص من اليمين إلى اليسار.
  المصدر: https://github.com/DavBfr/dart_pdf عند الوسم pdf-3.11.3 (Apache-2.0).
version: 3.11.3
homepage: https://github.com/DavBfr/dart_pdf/tree/master/pdf
repository: https://github.com/DavBfr/dart_pdf
issue_tracker: https://github.com/DavBfr/dart_pdf/issues
topics:
  - pdf
  - printer
  - print
  - printing
  - report

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  archive: ">=3.4.0 <4.1.0"
  barcode: ">=2.2.3 <3.0.0"
  bidi: ^2.0.10
  crypto: ^3.0.0
  image: ">=4.1.0 <4.6.0"
  meta: ">=1.3.0 <2.0.0"
  path_parsing: ">=0.2.0 <2.0.0"
  vector_math: ^2.1.0
  xml: ">=6.3.0 <7.0.0"
